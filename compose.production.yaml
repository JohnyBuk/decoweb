services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.production
    volumes:
      - ./frontend/dist:/app/dist:rw

  backend:
    restart: always
    build:
      context: backend
      dockerfile: Dockerfile.production
    volumes:
      - ./backend:/app
    env_file: .env

  nginx:
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf/:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/nginx/ssl/:ro
      - ./certbot/www:/var/www/certbot/:ro
    depends_on:
      - frontend
      - backend
    ports:
      - 80:80
      - 443:443
