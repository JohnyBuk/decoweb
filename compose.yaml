services:
  # development services
  frontend-development:
    restart: always
    build:
      context: frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app:rw
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend-development
    links:
      - backend-development:backend
    ports:
      - 5173:5173
    profiles:
      - development
    command: npm run dev

  backend-development:
    restart: always
    env_file: .env
    build:
      context: backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/static:/app/static:rw
      - ./backend:/app:rw
    ports:
      - 8000:8000
    profiles:
      - development
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  # production services
  frontend-production:
    build:
      context: frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/dist:/app/dist:rw
    profiles:
      - production
    command: npm run build

  backend-production:
    container_name: backend
    restart: always
    env_file: .env
    build:
      context: backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/static:/app/static
    profiles:
      - production
    command: bash -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 backend.wsgi:application"

  nginx:
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/var/www/html:ro
      - ./backend/static:/var/www/static/static:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      frontend-production:
        condition: service_completed_successfully
      backend-production:
        condition: service_started
    links:
      - backend-production:backend
    ports:
      - 80:80
      - 443:443
    profiles:
      - production

volumes:
  frontend_node_modules: